name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke-test the CLI
        run: |
          evalh run --agent reference --out results
          evalh run --agent noop --out results
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"

  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: docker build -t evalh-sandbox:latest -f docker/Dockerfile.sandbox .
      - run: evalh run --agent reference --sandbox docker --out results
