[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Reproducible, sandboxed benchmarking of AI coding agents on real repository tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chete Agamah" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalh = "evalh.cli:main"

[tool.setuptools.packages.find]
include = ["evalh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
