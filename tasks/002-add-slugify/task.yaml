id: 002-add-slugify
title: Implement slugify() from a written spec
tags: [feature, spec-following]
timeout_s: 600
prompt: |
  Add a function `slugify(text, max_length=None)` to textutils.py that turns a title into a URL slug.
  Requirements:
  - Lowercase the result.
  - Convert accented letters to plain ASCII ("Crème Brûlée" -> "creme-brulee"); drop other non-ASCII characters.
  - Replace every run of characters that are not a-z or 0-9 with a single hyphen.
  - No leading or trailing hyphens.
  - If max_length is given, truncate to at most max_length characters and then remove any trailing hyphen.
  - max_length below 1 raises ValueError.
  Do not change the existing functions in textutils.py.
